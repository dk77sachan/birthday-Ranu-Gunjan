<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Ranu &amp; Gunjan</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px; font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #fff3b0, #ffd6e7, #f7c6ff);
  }
  .card {
    width: min(680px, 100%); text-align: center; padding: 48px 24px;
    background: #ffc0cb; border: 8px solid deeppink; border-radius: 22px;
    box-shadow: 0 14px 35px rgba(150, 30, 90, .22);
    position: relative; overflow: hidden;
  }
  .decor { font-size: clamp(24px, 5vw, 38px); margin: 8px 0 22px; }
  h1 { color: purple; font-size: clamp(30px, 7vw, 52px); margin: 0 0 18px; }
  h2 { color: #8a006b; font-size: clamp(28px, 6vw, 46px); margin: 0 0 22px; }
  p { color: #8a145e; font-size: clamp(16px, 3vw, 22px); line-height: 1.5; margin: 0; }
  .footer { margin-top: 28px; font-size: 18px; color: #7b1fa2; }
</style>
</head>
<body>
  <main class="card">
    <div class="decor">🎉 🎂 🎈 💖 🎈 🎂 🎉</div>
    <h1>Happy Birthday!</h1>
    <h2>Ranu &amp; Gunjan</h2>
    <p>Wishing you lots of happiness, love, laughter, and wonderful memories.</p>
    <div class="footer">✨ Have a beautiful birthday! ✨</div>
    <div class="decor">🌸 💝 🌸</div>
  </main>
</body>
</html>
